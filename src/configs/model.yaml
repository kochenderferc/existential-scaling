# model name and port come from .env (MODEL_N / PORT_N)

# Optional: text prepended to the experimental system prompt. Needed for models
# that keep behaviour in a built-in system prompt their template only inserts
# when no system message is sent (Mistral reasoning models keep the "think"
# instruction there, so a bare experimental prompt turns thinking off). See
# model_ministral_reasoning.yaml. Qwen models do not need it.
#   system_prefix_file: data/system_prompts/<name>.txt
#   system_prefix: "literal text instead of a file"

context_window: 32768

enable_thinking: true
thinking_budget: 15000
# true: stop thinking at thinking_budget, force </think>, then answer with up to
# max_output_tokens. false: one request with max_tokens = thinking_budget + max_output_tokens.
enforce_thinking_budget: true
max_output_tokens: 10000

thinking_temp: 0.6
nonthinking_temp: 0.1
top_p: 0.95
top_k: 20
presence_penalty: 1.5
repetition_penalty: 1.0


